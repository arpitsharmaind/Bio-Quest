services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./financeai-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file: 
      - ./.env.db
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: